<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StandByMe | Dashboard</title>

    <link rel="stylesheet" href="../css/dashboards.css" />
    <script src="../js/sessao.js"></script>
    <script src="../js/loading.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="validarSessao(), buscarAvaliacoes(), buscarFavoritos()">

    <div class="janela">

        <div class="header-left">
            <a href="../homePageLogada.html">
                <h1>StandByMe</h1>
            </a>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span></h3>
            </div>

            <div class="btn-nav">
                <a href="../homePageLogada.html">
                    <h3>Home</h3>
                </a>
            </div>
            <div class="btn-nav">
                <a href="../dashboard/avalicao.html">
                    <h3>Avaliação</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        </div>

        <div class="dash">

            <div class="dash-topo">
                <h2>StandStats</h2>
                <p>Veja os números do StandByMe</p>
            </div>

            <div class="cards-resumo">
                <div class="card-resumo">
                    <h3>Avaliações</h3>
                    <p id="qtdUsuarios">0</p>
                </div>

                <div class="card-resumo">
                    <h3>Personagem mais favoritado</h3>
                    <p id="personagemTop">—</p>
                </div>
            </div>

            <div class="area-graficos">
                <div class="caixa-grafico">
                    <h3>Comparação de avaliações</h3>
                    <canvas id="graficoUsuarios"></canvas>
                </div>

                <div class="caixa-grafico">
                    <h3>Personagens favoritos</h3>
                    <canvas id="graficoFavoritos"></canvas>
                </div>
            </div>

        </div>
    </div>

</body>

</html>

<script>
    // 1. Nome do usuário na dashboard
    if (sessionStorage.NOME_USUARIO != undefined) {
        b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
    }

    function limparSessao() {
        sessionStorage.clear();
        window.location.href = "../index.html";
    }

    // ---------- DICIONÁRIOS ----------
    var coresPersonagens = {
        "Jonathan Joestar": "#4361ee",
        "Joseph Joestar": "#2a9d8f",
        "Jotaro Kujo": "#3a86ff",
        "Josuke Higashikata": "#f72585",
        "Giorno Giovanna": "#f5c518",
        "Jolyne Cujoh": "#9d4edd",
        "Johnny Joestar": "#ff7f11",
        "Josuke Higashikata (Parte 8)": "#06d6a0",
        "Jodio Joestar": "#ef233c"
    };

    var nomesCurtos = {
        "Josuke Higashikata": "Josuke (Parte 4)",
        "Josuke Higashikata (Parte 8)": "Josuke (Parte 8)"
    };

    // ---------- AVALIAÇÕES (GRÁFICO DE COMPARAÇÃO + CARD) ----------
    function buscarAvaliacoes() {
        fetch("/avaliacoes/listar")
            .then(function (resposta) {
                if (resposta.status == 204) {
                    return [];
                }
                if (!resposta.ok) {
                    throw new Error("Erro ao buscar avaliações: " + resposta.status);
                }
                return resposta.json();
            })
            .then(function (dados) {
                console.log("Avaliações recebidas: ", dados);
                
                // Atualiza o card superior com o total de avaliações feitas
                qtdUsuarios.innerHTML = dados.length;

                if (dados.length > 0) {
                    plotarGraficoAvaliacoes(dados);
                }
            })
            .catch(function (erro) {
                console.error("Erro nas avaliações: ", erro);
            });
    }

    function plotarGraficoAvaliacoes(dados) {
        var usuarios = [];
        var notas = [];

        for (var i = 0; i < dados.length; i++) {
            // Aceita tanto 'nome' quanto 'nomeUsuario', e tanto 'estrelas' quanto 'nota'
            var nomeUser = dados[i].nome || dados[i].nomeUsuario || "Usuário " + (i + 1);
            var notaUser = dados[i].estrelas || dados[i].nota || 0;

            usuarios.push(nomeUser);
            notas.push(notaUser);
        }

        var elementoCanvas = document.getElementById('graficoUsuarios');

        new Chart(elementoCanvas, {
            type: 'bar',
            data: {
                labels: usuarios,
                datasets: [{
                    label: 'Estrelas',
                    data: notas,
                    backgroundColor: '#f5c518',
                    borderColor: '#000000',
                    borderWidth: 2,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 5,
                        ticks: {
                            stepSize: 1,
                            color: '#e8e0f0'
                        },
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    x: {
                        ticks: {
                            color: '#e8e0f0'
                        },
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });
    }

    // ---------- FAVORITOS (GRÁFICO DE PIZZA + CARD) ----------
    function buscarFavoritos() {
        fetch("/favorito/metricas")
            .then(function (resposta) {
                if (resposta.status == 204) {
                    return [];
                }
                if (!resposta.ok) {
                    throw new Error("Erro na API, status " + resposta.status);
                }
                return resposta.json();
            })
            .then(function (dados) {
                console.log("Dados dos favoritos recebidos: ", dados);
                if (dados.length > 0) {
                    plotarGraficoFavoritos(dados);
                }
            })
            .catch(function (erro) {
                console.error("Erro ao buscar favoritos: ", erro);
            });
    }

    function plotarGraficoFavoritos(dados) {
        var nomes = [];
        var votos = [];
        var cores = [];

        for (var i = 0; i < dados.length; i++) {
            var nomeOriginal = dados[i].nomePersonagem;

            nomes.push(nomesCurtos[nomeOriginal] || nomeOriginal);
            votos.push(dados[i].totalVotos);
            cores.push(coresPersonagens[nomeOriginal] || '#f5c518');
        }

        if (dados.length > 0 && dados[0].totalVotos > 0) {
            personagemTop.innerHTML = nomes[0];
        }

        new Chart(graficoFavoritos, {
            type: 'pie',
            data: {
                labels: nomes,
                datasets: [{
                    data: votos,
                    backgroundColor: cores,
                    borderColor: '#000000',
                    borderWidth: 2
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#e8e0f0',
                            font: { size: 12, weight: 'bold' }
                        }
                    }
                },
            }
        });
    }
</script>
