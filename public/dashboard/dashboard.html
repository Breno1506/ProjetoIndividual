<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StandByMe | Dashboard</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="validarSessao(), buscarQtdUsuarios(), buscarFavoritos()">

    <div class="janela">

        <div class="header-left">
            <a href="../homePageLogada.html"><h1>StandByMe</h1></a>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav">
                <a href="../homePageLogada.html"><h3>Home</h3></a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        </div>

        <div class="dash">

            <div class="dash-topo">
                <h2>StandStats</h2>
                <p>Veja os números do StandByMe</p>
            </div>

            <div class="cards-resumo">
                <div class="card-resumo">
                    <h3>Usuários cadastrados</h3>
                    <p id="qtdUsuarios">0</p>
                </div>

                <div class="card-resumo">
                    <h3>Personagem mais favoritado</h3>
                    <p id="personagemTop">-</p>
                </div>
            </div>

            <div class="area-graficos">
                <div class="caixa-grafico">
                    <h3>Usuários cadastrados</h3>
                    <canvas id="graficoUsuarios"></canvas>
                </div>

                <div class="caixa-grafico">
                    <h3>Personagens favoritos</h3>
                    <canvas id="graficoFavoritos"></canvas>
                </div>
            </div>

        </div>
    </div>

</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    // ---------- USUÁRIOS ----------

    function buscarQtdUsuarios() {
        fetch("/usuarios/contar")
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (dados) {
                console.log("Qtd Usuários: ", dados);
                qtdUsuarios.innerHTML = dados[0].total;
                plotarGraficoUsuarios(dados[0].total);
            });
    }

    function plotarGraficoUsuarios(total) {
        new Chart(graficoUsuarios, {
            type: 'bar',
            data: {
                labels: [total + ' usuários'],
                datasets: [{
                    data: [total],
                    backgroundColor: '#f5c518',
                    borderColor: '#000000',
                    borderWidth: 3,
                    borderRadius: 6,
                    barThickness: 90
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        ticks: { color: '#f5c518', font: { size: 16, weight: 'bold' } },
                        grid: { display: false }
                    },
                    y: {
                        beginAtZero: true,
                        suggestedMax: total + 2,
                        ticks: { color: '#e8e0f0', precision: 0 },
                        grid: { color: '#3b2a55' }
                    }
                }
            }
        });
    }

    // ---------- FAVORITOS ----------

    var coresPersonagens = {
        "Jonathan Joestar": "#4361ee",
        "Joseph Joestar": "#2a9d8f",
        "Jotaro Kujo": "#3a86ff",
        "Josuke Higashikata": "#f72585",
        "Giorno Giovanna": "#f5c518",
        "Jolyne Cujoh": "#9d4edd",
        "Johnny Joestar": "#ff7f11",
        "Josuke Higashikata (Parte 8)": "#06d6a0",
        "Jodio Joestar": "#ef233c"
    };

    var nomesCurtos = {
        "Josuke Higashikata": "Josuke (Parte 4)",
        "Josuke Higashikata (Parte 8)": "Josuke (Parte 8)"
    };

    function buscarFavoritos() {
        fetch("/favorito/metricas")
            .then(function (resposta) {
                if (resposta.status == 204) {
                    return [];
                }
                if (!resposta.ok) {
                    throw new Error("Erro na API, status " + resposta.status);
                }
                return resposta.json();
            })
            .then(function (dados) {
                console.log("Dados dos favoritos recebidos: ", dados);
                if (dados.length > 0) {
                    plotarGraficoFavoritos(dados);
                }
            })
            .catch(function (erro) {
                console.error("Erro ao buscar favoritos: ", erro);
            });
    }

    function plotarGraficoFavoritos(dados) {
        var nomes = [];
        var votos = [];
        var cores = [];

        for (var i = 0; i < dados.length; i++) {
            var nomeOriginal = dados[i].nomePersonagem;

            nomes.push(nomesCurtos[nomeOriginal] || nomeOriginal);
            votos.push(dados[i].totalVotos);
            cores.push(coresPersonagens[nomeOriginal] || '#f5c518');
        }

        if (dados[0].totalVotos > 0) {
            personagemTop.innerHTML = nomes[0];
        }

        new Chart(graficoFavoritos, {
            type: 'bar',
            data: {
                labels: nomes,
                datasets: [{
                    data: votos,
                    backgroundColor: cores,
                    borderColor: '#000000',
                    borderWidth: 3
                }]
            },
            options: {
                indexAxis: 'y',
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        ticks: { color: '#e8e0f0', precision: 0 },
                        grid: { color: '#3b2a55' }
                    },
                    y: {
                        ticks: { color: '#f5c518', font: { size: 13, weight: 'bold' } },
                        grid: { display: false }
                    }
                }
            }
        });
    }
</script>
